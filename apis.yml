aid: doomersion
name: Doomersion
description: >-
  Doomersion (doomlingo.ai) is a consumer mobile language-learning app that
  teaches languages by "doomscrolling" — a vertical, TikTok-style feed of
  short-form videos in the learner's target language, matched to their level,
  with clickable explainer subtitles that let you tap any word for an instant
  translation and grammar note. Founded by Mostafa Afr and backed by Y
  Combinator, the app ships on iOS and Android. Doomersion exposes no public
  developer API, SDK, or documentation surface; this record is an API
  Evangelist network company profile capturing its public web and identity
  footprint.
